# Training config for the smoke test.  Tiny + fast.
run_name: smoke-test
model_name: einx-smoke

dataset_path: data/processed/smoke_train.jsonl
val_dataset_path: data/processed/smoke_val.jsonl
tokenizer_path: data/tokenized/smoke-bpe.json

batch_size: 2
grad_accum_steps: 1
learning_rate: 0.001
weight_decay: 0.1
max_grad_norm: 1.0

warmup_steps: 2
lr_schedule: cosine
min_lr_ratio: 0.1

max_steps: 5                    # tiny
max_epochs: 0

precision: fp32

checkpoint_dir: checkpoints
save_every_steps: 5
keep_last_n_checkpoints: 1

eval_every_steps: 0             # skip eval in smoke
eval_steps: 0

log_every_steps: 1
log_level: WARNING

seed: 42
device: cpu
