# Training config for the EINX-Experimental first-run experiment.
# Small enough to complete in a few minutes on CPU.

run_name: einx-experimental-run-1
model_name: einx-experimental

dataset_path: data/processed/train.jsonl
val_dataset_path: data/processed/val.jsonl
tokenizer_path: data/tokenized/einx-bpe.json

batch_size: 8
grad_accum_steps: 4            # effective batch = 32
learning_rate: 0.0003
weight_decay: 0.1
max_grad_norm: 1.0

warmup_steps: 50
lr_schedule: cosine
min_lr_ratio: 0.1

max_steps: 500                 # tiny — first-run experiment
max_epochs: 0

precision: fp32

checkpoint_dir: checkpoints
save_every_steps: 250
keep_last_n_checkpoints: 3

eval_every_steps: 100
eval_steps: 25

log_every_steps: 10
log_level: INFO

seed: 42
device: auto
