# Training config for EINX-Pretrain-2 — diverse corpus pretraining.
run_name: pretrain-2
model_name: einx-pretrain-2

dataset_path: data/raw/training_corpus_v2.jsonl
val_dataset_path: data/processed_v2/val
tokenizer_path: data/tokenized/einx-bpe-v3.json

batch_size: 16
grad_accum_steps: 1
learning_rate: 0.0008
weight_decay: 0.1
max_grad_norm: 1.0

warmup_steps: 50
lr_schedule: cosine
min_lr_ratio: 0.1

max_steps: 500
max_epochs: 0

precision: fp32

checkpoint_dir: checkpoints
save_every_steps: 100
keep_last_n_checkpoints: 3

eval_every_steps: 100
eval_steps: 20

log_every_steps: 25
log_level: WARNING

seed: 42
device: cpu
