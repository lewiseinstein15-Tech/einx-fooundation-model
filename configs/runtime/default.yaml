# Default runtime config (Build 2.1 — spec §16).
# Every field defaults to "auto" — EINX detects the best option from
# actual hardware.  Override any field explicitly to force a specific
# behaviour.

runtime:
  device: auto          # auto | cpu | cuda | cuda:0 | mps
  precision: auto       # auto | fp32 | fp16 | bf16
  distributed: auto     # auto | none | ddp | fsdp
  backend: auto         # auto | nccl | gloo | mpi
  compile: false        # torch.compile toggle (default off — adds warmup)
