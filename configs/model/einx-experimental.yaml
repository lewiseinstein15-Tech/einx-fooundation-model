# EINX-Experimental — v0.1 research prototype.
# Tiny transformer (~2M params) for first-run experiments on CPU.
# Real architecture, just small.

name: einx-experimental
version: "0.1.0"
arch: decoder-only-transformer

vocab_size: 4096
hidden_dim: 128
n_layers: 4
n_heads: 4
head_dim: 32
max_context_length: 256
ffn_dim: 512
dropout: 0.1

positional_encoding: rope       # rope | learned
norm_type: rms                   # rms | layer
precision: fp32                 # fp32 | fp16 | bf16
tie_word_embeddings: true

bos_token_id: 1
eos_token_id: 2
pad_token_id: 0
unk_token_id: 3
